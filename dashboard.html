<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>員工旅遊報名 後台 ｜ 訊映光電</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--forest-800:#003057;--forest-700:#0c3a63;--forest-600:#1a4a73;--moss:#3f7fb0;--cream:#eef3f8;--paper:#ffffff;--bark:#39495a;--gold:#ff5c39;--rust:#e0492a;--line:#d6e0ea;--ink:#1c2b3a;--muted:#6b7a89;--shadow:0 12px 40px -18px rgba(0,31,58,.55);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(1200px 500px at 80% -10%,rgba(26,74,115,.18),transparent 60%),var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:24px 18px 64px;}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(22px,4vw,30px);color:var(--forest-800);margin:6px 0 2px;}
  .okb-logo{height:34px;width:auto;display:block;margin-bottom:6px;}
  .lead{color:var(--muted);font-size:14px;margin:0 0 14px;}

  input{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;}
  input:focus{outline:none;border-color:var(--forest-600);box-shadow:0 0 0 4px rgba(0,48,87,.14);}
  .btn{background:var(--forest-700);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:11px;cursor:pointer;transition:.15s;}
  .btn:hover{background:var(--forest-600);}
  .btn.gold{background:var(--gold);color:#23200f;}
  .btn.ghost{background:#e7f0f8;color:var(--forest-700);}

  /* groups */
  .section-t{font-family:"Noto Serif TC";font-weight:700;color:var(--forest-800);font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-t::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--moss);display:inline-block;}
  .grid{display:grid;gap:12px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:760px){.g4,.g3{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 6px 24px -20px rgba(0,31,58,.5);}
  .stat .k{font-size:13px;color:var(--muted);}
  .stat .v{font-family:"Noto Serif TC";font-size:28px;font-weight:900;color:var(--forest-800);line-height:1.1;margin-top:4px;}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px;}
  .stat.money .v{color:var(--rust);font-size:23px;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .idnote{font-size:12.5px;color:var(--muted);margin:0 0 8px;}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);}
  table{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:auto;}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid #e1e9f1;vertical-align:top;}
  th{background:var(--forest-700);color:#fff;font-weight:700;white-space:nowrap;}
  td{word-break:break-word;}
  td.num{text-align:right;white-space:nowrap;}
  td.nowrap{white-space:nowrap;}
  td.emp{color:var(--forest-700);font-weight:700;}
  td.fam{color:var(--bark);}
  .reg{font-family:monospace;font-size:11px;color:var(--muted);}
  .loading{text-align:center;color:var(--muted);padding:30px;}

  /* 一張報名單一個視覺區塊：相鄰交替深淺＋第一列上方加綠線 */
  tr.reg-band-0 td{background:#ffffff;}
  tr.reg-band-1 td{background:#f4f8fc;}
  tr.reg-first td{border-top:2px solid var(--moss);}
  tr.reg-first td:first-child{box-shadow:inset 3px 0 0 var(--gold);}

  /* 管理員模式：未進入前隱藏管理員專用元件 */
  body:not(.admin-mode) .admin-only{display:none !important;}
  .admin-badge{display:inline-flex;align-items:center;gap:6px;background:#e7f7ec;color:#1f7a44;border:1px solid #b6dec5;font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:11px;}
  .admin-badge .x{cursor:pointer;color:#1f7a44;opacity:.7;font-weight:900;margin-left:2px;}
  .admin-badge .x:hover{opacity:1;}

  /* password modal */
  .overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:rgba(0,31,58,.5);backdrop-filter:blur(5px);}
  .overlay.show{display:grid;}
  .modal{background:var(--paper);border-radius:18px;max-width:360px;width:100%;padding:26px 24px;box-shadow:var(--shadow);text-align:center;}
  .modal h3{font-family:"Noto Serif TC";color:var(--forest-800);margin:0 0 6px;font-size:20px;}
  .modal p{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
  .modal .row{display:flex;gap:8px;margin-top:14px;}
  .modal .row .btn{flex:1;}
  .merr{display:none;color:#9a3414;background:#fbe6df;border:1px solid #e7a78f;border-radius:10px;padding:8px 11px;font-size:13px;margin-top:10px;}
  .merr.show{display:block;}

  /* 房間分配 */
  .roombar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px;}
  .rsum{font-size:13.5px;color:var(--muted);} .rsum b{color:var(--forest-800);font-family:"Noto Serif TC";}
  .roomhint{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  .pendwrap{display:flex;flex-wrap:wrap;gap:8px;min-height:24px;margin-bottom:6px;}
  .pchip{border:1.5px solid var(--gold);background:#fff4f0;color:var(--forest-800);border-radius:12px;padding:7px 12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;transition:.12s;}
  .pchip small{font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;}
  .pchip:hover{background:var(--gold);color:#fff;} .pchip:hover small{color:#ffe;}
  .roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;}
  .roomcard{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;transition:.12s;}
  .roomcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,92,57,.18);}
  .rhead{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
  .rhead b{font-size:15px;color:var(--forest-800);}
  .rcap{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;width:auto;background:#fff;}
  .rstatus{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:auto;}
  .rstatus.need{background:#fff4f0;color:var(--rust);} .rstatus.full{background:#e7f0f8;color:var(--forest-700);} .rstatus.over{background:#fbe6df;color:#9a3414;}
  .rdel{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
  .rmembers{display:flex;flex-wrap:wrap;gap:6px;}
  .mchip{background:#e7f0f8;color:var(--forest-800);border-radius:9px;padding:5px 8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
  .mchip i{cursor:pointer;color:var(--rust);font-style:normal;font-size:12px;}
  .addroom{border:1.5px dashed var(--moss);background:#eaf2fa;color:var(--forest-700);border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:84px;}
  .addroom:hover{background:var(--forest-600);color:#fff;border-style:solid;}
  .lockwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .lockcard{background:#f4f8fc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--forest-800);}
  .lockcard small{color:var(--muted);margin-left:6px;}
  .muted2{color:var(--muted);font-size:13px;}
  .roommsg{margin-top:14px;font-size:14px;font-weight:700;min-height:20px;}

  /* 篩選列 */
  .filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 10px;}
  .filterbar select,.filterbar input{width:auto;flex:0 1 230px;font-size:14px;padding:9px 12px;}
  .filterbar .fcount{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;}
  /* 部門複選 chips */
  .deptfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;}
  .deptfilter .flabel{font-size:13px;font-weight:700;color:var(--forest-800);margin-right:2px;}
  .dgrp{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:8px;}
  .deptchip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.12s;}
  .deptchip:hover{border-color:var(--moss);}
  .deptchip.on{background:var(--forest-700);border-color:var(--forest-700);color:#fff;}
  .deptchip.all.on{background:var(--gold);border-color:var(--gold);color:#23200f;}
  .btn.openst{background:#e7f7ec;color:#1f7a44;}
  .btn.closedst{background:#fbe6df;color:#9a3414;}
  .edit-btn{white-space:nowrap;padding:4px 10px !important;font-size:12px !important;}
  .modal label.el{display:block;text-align:left;font-size:13px;font-weight:700;color:var(--bark);margin:12px 0 5px;}
  .modal .ewho{text-align:left;background:#eef4fa;border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--forest-800);margin-bottom:2px;}
  /* 補助名單編輯 */
  #subBody input{padding:8px 10px;font-size:14px;}

  /* 整張單編輯 modal */
  .er-modal{max-width:680px;width:100%;text-align:left;max-height:92vh;overflow-y:auto;}
  .er-modal h3{text-align:left;margin-bottom:4px;}
  .er-warn{background:#fff4f0;border:1px solid #ffd9cb;color:#9a3414;font-size:12.5px;line-height:1.55;padding:9px 12px;border-radius:10px;margin:10px 0 14px;}
  .er-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
  @media(max-width:520px){.er-grid2{grid-template-columns:1fr;}}
  .er-modal input, .er-modal select{padding:9px 11px;font-size:14px;}
  .er-rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .er-rooms label{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:7px 4px;cursor:pointer;font-size:13px;font-weight:700;color:var(--forest-800);background:#fff;}
  .er-rooms label.on{border-color:var(--gold);background:#fff4f0;}
  .er-rooms input{display:none;}
  .er-rooms small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;}
  .er-person{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff;}
  .er-person.self{border-color:var(--forest-700);background:#f6fafd;}
  .er-phead{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--forest-800);margin-bottom:6px;}
  .er-phead .tag{font-size:12.5px;}
  .er-phead .rm{border:none;background:none;color:var(--rust);font-family:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .er-ptoggle{display:flex;gap:6px;margin:6px 0 8px;}
  .er-ptoggle label{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700;background:#eef4fa;border-radius:9px;padding:6px 10px;cursor:pointer;}
  .er-ptoggle label.on{background:var(--forest-700);color:#fff;}
  .er-ptoggle input{display:none;}
  .er-pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;}
  @media(max-width:520px){.er-pgrid{grid-template-columns:1fr;}}
  .er-pgrid label.el{margin:6px 0 3px;font-size:12px;}
  .er-dob{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:4px;}
  .er-dob select{padding:9px 6px;font-size:13px;background-position:right 6px center;padding-right:20px;}
  .er-price{text-align:right;font-size:13px;color:var(--bark);margin-top:6px;}
  .er-price b{color:var(--forest-800);}
  .er-summary{background:#eef4fa;border-radius:10px;padding:11px 14px;margin-top:14px;}
  .er-line{display:flex;justify-content:space-between;font-size:14px;color:var(--bark);margin:2px 0;}
  .er-line b{color:var(--forest-800);font-family:"Noto Serif TC";}
  .er-line.big{font-size:17px;border-top:1px solid #c9d6e3;padding-top:6px;margin-top:6px;}
  .er-line.big b{color:var(--rust);font-size:20px;}
  .er-note{font-size:11.5px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div>
      <svg class="okb-logo" viewBox="0 0 313.25 167.46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OKB 歐克">
        <path fill="#ff5c39" d="M220.1,146.15v-19.25c-27.09,7.9-65.23,12.95-92.82,12.95s-60.2-3.32-92.82-12.95v19.25c25.58,7.38,62.57,12.4,92.82,12.4s66.77-3.63,92.82-12.4Z"/>
        <path fill="#003057" d="M280.26,56.11c7.69.98,16.37,8.53,16.37,21.83,0,15.25-9.37,26.02-30.22,26.02h-46.31s0-93.74,0-93.74h46.17c16.93,0,27.7,10.35,27.7,26.02,0,11.89-8.11,18.33-13.71,19.31v.56ZM239.13,49.39h23.78c7.56,0,12.59-4.76,12.59-12.03,0-6.58-5.18-10.91-11.33-10.91h-25.04s0,22.95,0,22.95ZM264.31,87.73c8.53,0,12.87-4.62,12.87-11.61,0-7.14-5.04-11.61-12.17-11.61h-25.88s0,23.22,0,23.22h25.18Z"/>
        <path fill="#003057" d="M182.74,103.96l-34.82-43.16h-.26v43.16s-22.11,0-22.11,0V10.22s22.11,0,22.11,0v38.13h.4s33.5-38.13,33.5-38.13h25.66s-40.38,43.16-40.38,43.16l42.76,50.58h-26.85Z"/>
        <path fill="#003057" d="M60.05,6.81c-27.77,0-50.28,22.51-50.28,50.28,0,27.77,22.51,50.28,50.28,50.28,27.77,0,50.28-22.51,50.28-50.28,0-27.77-22.51-50.28-50.28-50.28ZM60.05,86.14c-16.05,0-29.05-13.01-29.05-29.05,0-16.05,13.01-29.05,29.05-29.05,16.05,0,29.05,13.01,29.05,29.05,0,16.05-13.01,29.05-29.05,29.05Z"/>
        <circle fill="#ff5c39" cx="253.08" cy="133.3" r="13.95"/>
      </svg>
      <h1>2026 員工旅遊 報名後台</h1>
      <p class="lead">資料即時來自 Google 試算表。身分證預設遮蔽。</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn ghost" id="refreshBtn">↻ 重新整理</button>
      <button class="btn ghost admin-only" id="excelBtn">📥 下載 Excel</button>
      <button class="btn ghost admin-only" id="signupBtn">報名狀態…</button>
      <button class="btn ghost admin-only" id="subsidyBtn">💰 補助名單</button>
      <button class="btn ghost admin-only" id="deptBtn">🏢 部門設定</button>
      <button class="btn ghost admin-only" id="roomBtn">🛏️ 房間分配</button>
      <button class="btn ghost admin-only" id="idBtn">👁 顯示身分證</button>
      <button class="btn gold" id="adminBtn">🔐 進入管理員模式</button>
    </div>
  </div>
  <div id="content"><div class="loading">載入中…</div></div>
</div>

<!-- 密碼 modal（只在「顯示身分證」時出現） -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="pwTitle">顯示身分證</h3>
    <p id="pwSub">身分證為個資，請輸入後台密碼才能顯示完整號碼。</p>
    <input id="pw" type="password" placeholder="後台密碼" autocomplete="off" />
    <div class="merr" id="merr"></div>
    <div class="row">
      <button class="btn ghost" id="pwCancel">取消</button>
      <button class="btn gold" id="pwOk">確認顯示</button>
    </div>
  </div>
</div>

<!-- 編輯報名資料 modal -->
<div class="overlay" id="editOverlay">
  <div class="modal" style="max-width:420px;">
    <h3>編輯報名資料</h3>
    <div class="ewho" id="editWho"></div>
    <label class="el">要修改的欄位</label>
    <select id="editField"></select>
    <label class="el">新的內容</label>
    <input id="editValue" autocomplete="off" />
    <div class="merr" id="editErr"></div>
    <div class="row">
      <button class="btn ghost" id="editCancel">取消</button>
      <button class="btn gold" id="editSave">儲存修改</button>
    </div>
  </div>
</div>

<!-- 加入同行成員 modal -->
<div class="overlay" id="addOverlay">
  <div class="modal" style="max-width:440px;">
    <h3>＋ 加入同行成員</h3>
    <div class="ewho" id="addWho"></div>
    <label class="el">身分別</label>
    <div style="display:flex;gap:8px;">
      <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:#eef4fa;border-radius:10px;padding:9px 12px;cursor:pointer;"><input type="radio" name="addType" value="family" style="width:auto;" checked> 眷屬</label>
      <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:#eef4fa;border-radius:10px;padding:9px 12px;cursor:pointer;"><input type="radio" name="addType" value="employee" style="width:auto;"> 員工</label>
    </div>
    <div id="addRelWrap">
      <label class="el">關係</label>
      <select id="addRel"></select>
    </div>
    <div id="addEmpWrap" style="display:none;">
      <label class="el">工號</label>
      <input id="addEmpId" autocomplete="off" placeholder="補助依工號計算" />
    </div>
    <label class="el">姓名</label>
    <input id="addName" autocomplete="off" />
    <label class="el">年齡身分</label>
    <select id="addAge"></select>
    <label class="el">身分證 / 居留證號</label>
    <input id="addIdno" autocomplete="off" placeholder="投保用。外籍/移工請填居留證統一證號" />
    <label class="el">出生年月日</label>
    <input id="addDob" type="date" />
    <div class="ewho" id="addPricePreview" style="background:#fff4f0;margin-top:14px;"></div>
    <div class="merr" id="addErr"></div>
    <div class="row">
      <button class="btn ghost" id="addCancel">取消</button>
      <button class="btn gold" id="addSave">加入並重算</button>
    </div>
  </div>
</div>

<!-- 整張單編輯 modal -->
<div class="overlay" id="editRegOverlay">
  <div class="modal er-modal">
    <h3>✏️ 編輯整張報名單</h3>
    <div class="ewho" id="erWho"></div>
    <div class="er-warn">⚠️ 儲存後此單的「分配房號」會被清空（人或順序可能變動）。如已併房，請儲存後重新到「🛏️ 房間分配」分配房間。費用、補助、獨住加價會由系統自動重算。</div>

    <div class="er-grid2">
      <div><label class="el">聯絡窗口</label><input id="erContact" autocomplete="off" /></div>
      <div><label class="el">部門</label><select id="erDept"></select></div>
      <div><label class="el">聯絡電話</label><input id="erPhone" autocomplete="off" /></div>
      <div><label class="el">Email</label><input id="erEmail" autocomplete="off" /></div>
    </div>

    <label class="el" style="margin-top:14px;">房型</label>
    <div class="er-rooms" id="erRooms"></div>

    <label class="el" style="margin-top:14px;">成員</label>
    <div id="erPeople"></div>
    <button class="btn ghost" id="erAdd" type="button" style="margin-top:8px;">＋ 加同行者</button>

    <div class="er-summary">
      <div class="er-line"><span>總費用</span><b id="erTotal">NT$ 0</b></div>
      <div class="er-line"><span>公司補助（預估）</span><b id="erSubsidy">NT$ 0</b></div>
      <div class="er-line" id="erSurRow" style="display:none;"><span>獨住加價</span><b id="erSur">NT$ 0</b></div>
      <div class="er-line big"><span>自負額</span><b id="erBalance">NT$ 0</b></div>
      <div class="er-note">補助金額會在送出後依後端「補助設定」分頁重新計算，預估值僅供參考。</div>
    </div>

    <div class="merr" id="erErr"></div>
    <div class="row">
      <button class="btn ghost" id="erCancel">取消</button>
      <button class="btn gold" id="erSave">💾 儲存整張單</button>
    </div>
  </div>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzGE46TFzPMXlfBvT88mLjobexmgnpSlWf_U_Rl2PBzWMUca7_mUc5-pI64F75Kx8ymKg/exec";
const DEFAULT_SUBSIDY = 10000;
let SHOW_ID = false;
const fmt = n => Number(n||0).toLocaleString("en-US");

/* 部門清單由後端「部門設定」分頁提供，載入後填入 DEPT_GROUPS。
   結構：{ "業務處":["業務部",...], "獨立單位":["總經理室",...] } */
let DEPT_GROUPS = {};
async function loadDeptList(){
  try{
    const r = await fetch(ENDPOINT + "?action=deptList&_=" + Date.now(), {credentials:"omit"});
    const j = await r.json();
    if(j && j.ok && Array.isArray(j.depts)){
      const g = {};
      j.depts.forEach(function(d){ (g[d.group] = g[d.group] || []).push(d.name); });
      DEPT_GROUPS = g;
    }
  }catch(e){ /* 失敗時 DEPT_GROUPS 保持空，篩選器仍可工作 */ }
}
/* 回傳全部部門「處／部門」格式字串清單（給篩選用） */
function allDeptValues(){
  const out = [];
  Object.keys(DEPT_GROUPS).forEach(function(g){
    DEPT_GROUPS[g].forEach(function(d){ out.push(g + '／' + d); });
  });
  return out;
}
/* 價目表／年齡分類／眷屬關係（與報名表一致，供「加人」計算費用）*/
const PRICES = {
  "2": {adult:6725, student:6655, senior:6565, disabled:6525, child25:3000, baby:1500},
  "3": {adult:6525, student:6455, senior:6365, disabled:6325, child25:2800, baby:1500},
  "4": {adult:6325, student:6255, senior:6165, disabled:6125, child25:2600, baby:1500},
};
const AGE_LABELS = {
  adult:"成人",
  student:"6-12歲 學生及兒童",
  senior:"65歲以上長者（持榮譽志工證）",
  disabled:"持身心障礙手冊（含一位陪同）",
  child25:"2-5歲（不佔床・含餐）",
  baby:"未滿 2 歲（不足2歲）",
};
const FAMILY_REL = ["配偶","子女（直系）","父母（直系）","兄弟姊妹","情侶"];
/* 後台可編輯欄位（key 要與 Code.gs 的 EDIT_COLS 一致） */
const EDIT_FIELDS = [
  {k:"name",label:"姓名"},{k:"relationship",label:"關係"},{k:"empId",label:"工號"},
  {k:"dept",label:"部門"},{k:"idNumber",label:"身分證字號"},{k:"dob",label:"出生年月日"},
  {k:"room",label:"房型"},{k:"occupancy",label:"住宿安排"},
  {k:"contact",label:"聯絡窗口"},{k:"phone",label:"聯絡電話"},{k:"email",label:"Email"},
];

let CURRENT = null;                 // 最近一次後台資料（含 roster / signupOpen）
let SIGNUP_OPEN = null;             // 報名開放狀態
const FILTER = { depts:[], q:"" };   // 名單篩選（depts 可複選）
let rosterIndex = {};               // row -> roster 物件（目前顯示中）
let editingRow = null;              // 正在編輯的列號
let SUBSIDY_ROWS = [];              // 補助名單編輯暫存
let ADMIN_MODE = false;             // 是否在管理員模式（一次登入、全功能解鎖）

/* 年齡身分簡稱（表格用） */
function ageShort(a){
  a = a || "";
  if(a.indexOf("成人")===0) return "成人";
  if(a.indexOf("6-12")===0) return "學生/兒童";
  if(a.indexOf("65")===0) return "長者";
  if(a.indexOf("身心")>=0||a.indexOf("障")>=0) return "身障";
  if(a.indexOf("2-5")===0||a.indexOf("2-5")>=0) return "2-5歲";
  if(a.indexOf("未滿")>=0||a.indexOf("2 歲")>=0) return "未滿2歲";
  return a;
}
function occDisplay(o, surcharge){
  if(o==="公司安排合住人") return "公司合住";
  if(o==="獨住加價") return "獨住 +" + fmt(surcharge||0);
  return o||"";
}

/* 用 credentials:"omit" 取資料：不送 Google cookie，避免多帳號被導去 /u/N 而失敗 */
async function fetchData(params){
  const q = Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k])).join("&");
  try{
    const r = await fetch(ENDPOINT + "?action=dashboard&" + q + "&_=" + Date.now(), {credentials:"omit"});
    return await r.json();
  }catch(e){ return {ok:false, error:"連線失敗，請稍後再試。"}; }
}

async function load(pw){
  document.getElementById("content").innerHTML = '<div class="loading">載入中…</div>';
  const params = { showId: SHOW_ID ? 1 : 0 };
  if(SHOW_ID && pw) params.pw = pw;
  const res = await fetchData(params);
  if(!res || !res.ok){
    document.getElementById("content").innerHTML = '<div class="loading">'+((res&&res.error)||"載入失敗")+'</div>';
    return;
  }
  render(res);
}

function statCard(k,v,unit,money){
  return `<div class="stat${money?' money':''}"><div class="k">${k}</div><div class="v">${money?'NT$ ':''}${fmt(v)}${unit?`<small>${unit}</small>`:''}</div></div>`;
}
/* 主數字＋小字備註（房型分布用：主＝間數、小字＝人數） */
function statCardDual(k, main, mainUnit, sub){
  return '<div class="stat"><div class="k">'+k+'</div>'
    + '<div class="v">'+fmt(main)+'<small>'+mainUnit+'</small></div>'
    + '<div class="k" style="margin-top:2px;font-size:12px;">'+sub+'</div></div>';
}

function deptChips(){
  const sel = FILTER.depts || [];
  let html = '<span class="flabel">部門：</span>'
    + '<button class="deptchip all'+(sel.length===0?' on':'')+'" data-d="__all">全部</button>';
  Object.keys(DEPT_GROUPS).forEach(function(g){
    html += '<span class="dgrp">'+esc(g)+'</span>';
    DEPT_GROUPS[g].forEach(function(d){
      const v=g+'／'+d;
      html += '<button class="deptchip'+(sel.indexOf(v)>=0?' on':'')+'" data-d="'+esc(v)+'">'+esc(d)+'</button>';
    });
  });
  return html;
}
function updateSignupBtn(){
  const b = document.getElementById("signupBtn"); if(!b) return;
  b.classList.remove("openst","closedst");
  if(SIGNUP_OPEN===null){ b.textContent="報名狀態…"; return; }
  if(SIGNUP_OPEN){ b.textContent="🟢 報名開放中"; b.classList.add("openst"); }
  else { b.textContent="🔴 報名已關閉"; b.classList.add("closedst"); }
}
function rowHtml(r, firstOfReg, bandIdx, regBalance){
  const cls = 'reg-band-'+(bandIdx%2)+(firstOfReg?' reg-first':'');
  const balCell = firstOfReg
    ? '<td class="num" style="color:var(--rust);font-weight:700;">NT$ '+fmt(regBalance||0)+'</td>'
    : '<td class="num" style="color:var(--muted);">↑</td>';
  return '<tr class="'+cls+'">'
    +'<td class="reg nowrap">'+esc(r.regId||"")+'</td>'
    +'<td class="nowrap">'+esc(r.dept||"")+'</td>'
    +'<td>'+esc(r.contact||"")+'</td>'
    +'<td class="'+(r.type==='員工'?'emp':'fam')+' nowrap">'+esc(r.type||"")+'</td>'
    +'<td>'+esc(r.name||"")+'</td>'
    +'<td>'+esc(r.relationship||"")+'</td>'
    +'<td class="nowrap">'+esc(r.empId||"")+'</td>'
    +'<td class="nowrap">'+esc(ageShort(r.age))+'</td>'
    +'<td class="nowrap">'+esc(r.idNumber||"")+'</td>'
    +'<td class="nowrap">'+esc(r.dob||"")+'</td>'
    +'<td class="nowrap">'+esc(r.room||"")+'</td>'
    +'<td class="nowrap">'+esc(occDisplay(r.occupancy, r.surcharge))+'</td>'
    +'<td class="num">'+fmt(r.price)+'</td>'
    +'<td class="num">'+(r.subsidy!==""&&r.subsidy!=null?fmt(r.subsidy):"—")+'</td>'
    + balCell
    +'<td class="nowrap">'
      +(firstOfReg ? '<button class="btn ghost edit-btn editreg-btn admin-only" data-reg="'+esc(r.regId||"")+'">✏️ 編輯整張單</button>' : '<span style="color:var(--muted);font-size:11px;">同單↑</span>')
    +'</td>'
    +'</tr>';
}
function fillTable(){
  if(!CURRENT) return;
  const q = (FILTER.q||"").trim().toLowerCase();
  const deps = FILTER.depts||[];
  const list = CURRENT.roster.filter(function(r){
    if(deps.length && deps.indexOf(r.dept)<0) return false;
    if(q){
      const hay = ((r.name||"")+" "+(r.empId||"")+" "+(r.contact||"")+" "+(r.dept||"")).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  rosterIndex = {}; list.forEach(function(r){ rosterIndex[r.row]=r; });
  const tb = document.getElementById("rosterBody");
  const regBand = {}; let bandIdx = -1;
  const balances = (CURRENT && CURRENT.regBalances) || {};
  const bodyHtml = list.map(function(r){
    const f = !(r.regId in regBand);
    if(f){ bandIdx++; regBand[r.regId] = bandIdx; }
    return rowHtml(r, f, regBand[r.regId], balances[r.regId]);
  }).join("");
  if(tb) tb.innerHTML = bodyHtml || '<tr><td colspan="16" class="loading">沒有符合條件的資料</td></tr>';
  const c = document.getElementById("fCount"); if(c) c.textContent = "顯示 "+list.length+" / "+CURRENT.roster.length+" 人";
}

function render(res){
  CURRENT = res;
  const s = res.stats;
  SHOW_ID = !!res.showId;
  SIGNUP_OPEN = (typeof res.signupOpen === "boolean") ? res.signupOpen : SIGNUP_OPEN;
  document.getElementById("idBtn").textContent = SHOW_ID ? "隱藏身分證" : "顯示身分證";
  updateSignupBtn();

  const overview =
    statCard("報名單數", s.regCount, "筆") + statCard("總人數", s.totalPeople, "人") +
    statCard("員工", s.empCount, "人") + statCard("眷屬", s.famCount, "人");
  const rooms =
    statCardDual("2 人房", s.rooms2||0, "間", fmt(s.room2||0)+" 人入住")
    + statCardDual("3 人房", s.rooms3||0, "間", fmt(s.room3||0)+" 人入住")
    + statCardDual("4 人房", s.rooms4||0, "間", fmt(s.room4||0)+" 人入住");
  const occ =
    statCard("公司安排合住", s.companyCount, "筆") + statCard("獨住加價", s.singleCount, "筆");
  const money =
    statCard("總費用", s.totalCost, "", true) + statCard("公司補助合計", s.totalSubsidy, "", true) +
    statCard("獨住加價合計", s.totalSurcharge, "", true) + statCard("應補差額合計", s.totalBalance, "", true);

  document.getElementById("content").innerHTML = `
    <div class="section-t">報名概況</div>
    <div class="grid g4">${overview}</div>
    <div class="section-t">房型分布（房間數，含已分配與未分配估算）</div>
    <div class="grid g3">${rooms}</div>
    <div class="section-t">住宿安排</div>
    <div class="grid g3">${occ}</div>
    <div class="section-t">金額統計</div>
    <div class="grid g4">${money}</div>
    <div class="section-t">報名名單（每人一列）</div>
    <div class="idnote">${ADMIN_MODE ? (SHOW_ID ? "⚠️ 已進入管理員模式，目前顯示完整身分證，請注意保密。" : "已進入管理員模式。可按右上「顯示身分證」、或在名單按 ✏️編輯／＋加人。") : "目前為唯讀檢視（身分證已遮蔽）。如需編輯／加人／看身分證，請按右上「🔐 進入管理員模式」。"}</div>
    <div class="filterbar">
      <div class="deptfilter" id="fDept">${deptChips()}</div>
    </div>
    <div class="filterbar">
      <input id="fSearch" placeholder="搜尋 姓名／工號／聯絡窗口" value="${esc(FILTER.q)}" />
      <span class="fcount" id="fCount"></span>
    </div>
    <div class="tablewrap" id="rosterTableWrap"><table>
      <thead><tr>
        <th>報名單</th><th>部門</th><th>聯絡窗口</th><th>身分別</th><th>姓名</th><th>關係</th><th>工號</th>
        <th>年齡身分</th><th>身分證</th><th>出生年月日</th><th>房型</th><th>住宿</th>
        <th style="text-align:right">費用</th><th style="text-align:right">補助</th>
        <th style="text-align:right" title="此整張報名單的應補差額（含獨住加價）。同單成員列以箭頭表示，金額顯示於該單第一列。">自負額</th>
        <th>操作</th>
      </tr></thead>
      <tbody id="rosterBody"></tbody>
    </table></div>`;

  fillTable();
  document.getElementById("fDept").addEventListener("click", function(e){
    const b = e.target.closest && e.target.closest(".deptchip"); if(!b) return;
    const d = b.dataset.d;
    if(d==="__all"){ FILTER.depts=[]; }
    else { const i=FILTER.depts.indexOf(d); if(i>=0) FILTER.depts.splice(i,1); else FILTER.depts.push(d); }
    document.getElementById("fDept").innerHTML = deptChips();   // 更新 chip 選取狀態
    fillTable();
  });
  document.getElementById("fSearch").addEventListener("input", function(e){ FILTER.q=e.target.value; fillTable(); });
  document.getElementById("rosterTableWrap").addEventListener("click", function(e){
    const eb = e.target.closest && e.target.closest(".editreg-btn");
    if(eb && ADMIN_MODE){ startEditReg(eb.dataset.reg); return; }
  });
}

/* ===== 通用密碼 modal（顯示身分證 / 進入房間分配共用）===== */
const overlay = document.getElementById("overlay");
const merr = document.getElementById("merr");
let ADMIN_PW = "";        // 驗證成功後記住，供儲存併房用
let ROOM_MODE = false;
let pwCallback = null;
function openPw(title, sub, btnText, cb){
  document.getElementById("pwTitle").textContent = title;
  document.getElementById("pwSub").textContent = sub;
  document.getElementById("pwOk").textContent = btnText;
  pwCallback = cb;
  merr.classList.remove("show"); document.getElementById("pw").value="";
  overlay.classList.add("show"); document.getElementById("pw").focus();
}
function closePw(){ overlay.classList.remove("show"); }
function pwErr(m){ merr.textContent=m; merr.classList.add("show"); }
function confirmPw(){ const pw=document.getElementById("pw").value.trim(); if(!pw){ pwErr("請輸入密碼。"); return; } if(pwCallback) pwCallback(pw); }

/* ===== 管理員模式（一次登入、所有管理功能解鎖）===== */
function updateAdminUI(){
  document.body.classList.toggle("admin-mode", ADMIN_MODE);
  const btn = document.getElementById("adminBtn"); if(!btn) return;
  if(ADMIN_MODE){
    btn.innerHTML = '🟢 管理員模式 <span style="opacity:.7;margin-left:6px;font-weight:900;">✕</span>';
    btn.classList.remove("gold"); btn.classList.add("ghost");
    btn.title = "點此退出管理員模式";
  } else {
    btn.innerHTML = '🔐 進入管理員模式';
    btn.classList.add("gold"); btn.classList.remove("ghost");
    btn.title = "輸入密碼後解鎖編輯／加人／補助名單／房間分配／顯示身分證";
  }
  const idBtn = document.getElementById("idBtn");
  if(idBtn) idBtn.textContent = SHOW_ID ? "🙈 隱藏身分證" : "👁 顯示身分證";
}
async function enterAdminMode(pw){
  document.getElementById("content").innerHTML='<div class="loading">驗證中…</div>';
  const res = await fetchData({showId:1, pw:pw});
  if(res && res.ok && res.showId){
    ADMIN_PW = pw; ADMIN_MODE = true; SHOW_ID = true;
    closePw(); updateAdminUI(); render(res);
  } else {
    pwErr((res&&res.idError)||(res&&res.error)||"密碼錯誤。"); load();
  }
}
function exitAdminMode(){
  ADMIN_PW = ""; ADMIN_MODE = false; SHOW_ID = false; ROOM_MODE = false;
  updateAdminUI(); load();
}
document.getElementById("adminBtn").addEventListener("click", ()=>{
  if(ADMIN_MODE){
    if(confirm("確定要退出管理員模式嗎？\n身分證會自動隱藏。")) exitAdminMode();
  } else {
    openPw("進入管理員模式","輸入後台密碼後，編輯／加人／補助名單／房間分配／顯示身分證會一次解鎖。","進入", enterAdminMode);
  }
});

/* 顯示／隱藏身分證（已在管理員模式中，不用再驗密碼）*/
document.getElementById("idBtn").addEventListener("click", ()=>{
  if(!ADMIN_MODE) return;
  SHOW_ID = !SHOW_ID; updateAdminUI(); load(ADMIN_PW);
});

/* 房間分配（已在管理員模式中，直接進入）*/
document.getElementById("roomBtn").addEventListener("click", ()=>{
  if(!ADMIN_MODE) return;
  enterRoomMode();
});
document.getElementById("pwOk").addEventListener("click", confirmPw);
document.getElementById("pwCancel").addEventListener("click", closePw);
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") confirmPw(); });
document.getElementById("refreshBtn").addEventListener("click", ()=>{ ROOM_MODE=false; load(ADMIN_MODE?ADMIN_PW:undefined); });

/* ===== 房間分配 ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bedOf(s){var m=String(s).match(/(\d)/);return m?+m[1]:2;}
let roomData=null;

function buildRoomData(roster){
  var byReg={};
  roster.forEach(function(p){ (byReg[p.regId]=byReg[p.regId]||[]).push(p); });
  var locked=[], companyPeople=[];
  Object.keys(byReg).forEach(function(rid){
    var grp=byReg[rid], occ=grp[0].occupancy;
    if(occ==='公司安排合住人'){ grp.forEach(function(p){ companyPeople.push(p); }); }
    else locked.push({contact:grp[0].contact, room:grp[0].room, occupancy:occ, members:grp});
  });
  var rooms=[], map={};
  companyPeople.forEach(function(p){
    var rm=String(p.assignedRoom||'').trim();
    if(rm){ if(!map[rm]){ map[rm]={id:rm, cap:bedOf(p.room), members:[]}; rooms.push(map[rm]); }
      map[rm].members.push(p); map[rm].cap=Math.max(map[rm].cap, bedOf(p.room)); }
  });
  return {locked:locked, companyPeople:companyPeople, rooms:rooms, selected:null};
}
function findRoom(id){return roomData.rooms.find(function(r){return r.id===id;});}
function personByRow(row){return roomData.companyPeople.find(function(p){return p.row===row;});}
function removeFromRooms(row){ roomData.rooms.forEach(function(r){ r.members=r.members.filter(function(m){return m.row!==row;}); }); }
function nextId(){ var i=0; while(roomData.rooms.some(function(r){return r.id==='合住'+String.fromCharCode(65+i);})) i++; return '合住'+String.fromCharCode(65+i); }
function addRoom(){ var id=nextId(); roomData.rooms.push({id:id,cap:4,members:[]}); roomData.selected=id; renderRooms(); }
function delRoom(id){ roomData.rooms=roomData.rooms.filter(function(r){return r.id!==id;}); if(roomData.selected===id) roomData.selected=null; renderRooms(); }
function addToSel(row){ if(!roomData.selected){ roomMsg("請先點一間房（或先按＋新增房間）"); return; } removeFromRooms(row); findRoom(roomData.selected).members.push(personByRow(row)); renderRooms(); }
function roomMsg(t, ok){ var el=document.getElementById("roomMsg"); if(el){ el.textContent=t; el.style.color= ok?"var(--forest-700)":"var(--rust)"; } }

async function enterRoomMode(res){
  if(!res){ document.getElementById("content").innerHTML='<div class="loading">載入中…</div>'; res=await fetchData({showId:1, pw:ADMIN_PW}); if(!(res&&res.ok)){ document.getElementById("content").innerHTML='<div class="loading">讀取失敗</div>'; return; } }
  roomData=buildRoomData(res.roster); ROOM_MODE=true; renderRooms();
}
function exitRoomMode(){ ROOM_MODE=false; load(); }

function renderRooms(){
  var d=roomData;
  var inRoom={}; d.rooms.forEach(function(r){ r.members.forEach(function(m){ inRoom[m.row]=true; }); });
  var pending=d.companyPeople.filter(function(p){ return !inRoom[p.row]; });
  var usedRooms=d.rooms.filter(function(r){return r.members.length;}).length;
  var totalRooms=d.locked.length+usedRooms;

  var pendChips = pending.length
    ? pending.map(function(p){ return '<button class="pchip" data-row="'+p.row+'">'+esc(p.name)+'<small>'+esc(p.contact)+'・'+bedOf(p.room)+'人房</small></button>'; }).join('')
    : '<div class="muted2">（沒有待安排的人，全部已分配 👍）</div>';

  var roomCards = d.rooms.map(function(r){
    var n=r.members.length, gap=r.cap-n;
    var st = gap>0?('還缺 '+gap):(gap===0?'✓ 已滿':('超額 '+(-gap))), cls=gap<0?'over':(gap===0?'full':'need');
    var mem = r.members.length? r.members.map(function(m){ return '<span class="mchip">'+esc(m.name)+'<i data-rm="'+m.row+'">✕</i></span>'; }).join('') : '<span class="muted2">（空房，點上方待安排的人加入）</span>';
    return '<div class="roomcard'+(d.selected===r.id?' sel':'')+'" data-rid="'+esc(r.id)+'">'
      +'<div class="rhead"><b>'+esc(r.id)+'</b>'
      +'<select class="rcap" data-rid="'+esc(r.id)+'">'+[2,3,4].map(function(c){return '<option value="'+c+'"'+(c===r.cap?' selected':'')+'>'+c+'人</option>';}).join('')+'</select>'
      +'<span class="rstatus '+cls+'">'+n+'/'+r.cap+'・'+st+'</span>'
      +'<button class="rdel" data-rid="'+esc(r.id)+'">刪除</button></div>'
      +'<div class="rmembers">'+mem+'</div></div>';
  }).join('');

  var lockHtml = d.locked.length
    ? '<div class="section-t">固定房間（住滿／獨住，自動成房）</div><div class="lockwrap">'
      + d.locked.map(function(L){ return '<div class="lockcard"><b>'+bedOf(L.room)+'人房</b>　'+esc(L.contact)+'（'+L.members.length+'人）<small>'+(L.occupancy==='獨住加價'?'獨住':'住滿')+'</small></div>'; }).join('')
      + '</div>'
    : '';

  document.getElementById("content").innerHTML =
      '<div class="roombar">'
    +   '<button class="btn ghost" id="exitRoom">← 返回統計</button>'
    +   '<div class="rsum">固定房 <b>'+d.locked.length+'</b> 間 ・ 合住房 <b>'+usedRooms+'</b> 間 ・ 預估總房數 <b>'+totalRooms+'</b> 間 ・ 待安排 <b>'+pending.length+'</b> 人</div>'
    +   '<button class="btn gold" id="saveRoom">💾 儲存分配</button>'
    + '</div>'
    + '<div class="section-t">待安排名單（公司安排合住）'+(d.selected?'　→ 點人加入「'+esc(d.selected)+'」':'')+'</div>'
    + '<div class="pendwrap">'+pendChips+'</div>'
    + '<div class="section-t">合住房間</div>'
    + '<div class="roomhint">步驟：① 按「＋新增房間」並選人數 ② 點一下房間卡選取它 ③ 點上方待安排的人，即加入該房。點房內名字的 ✕ 可移回待安排。</div>'
    + '<div class="roomgrid">'+roomCards+'<button class="addroom" id="addRoom">＋ 新增房間</button></div>'
    + lockHtml
    + '<div id="roomMsg" class="roommsg"></div>';

  // 事件
  var c=document.getElementById("content");
  document.getElementById("exitRoom").onclick=exitRoomMode;
  document.getElementById("saveRoom").onclick=saveRoomAssignments;
  document.getElementById("addRoom").onclick=addRoom;
  c.querySelectorAll(".pchip").forEach(function(b){ b.onclick=function(){ addToSel(Number(b.dataset.row)); }; });
  c.querySelectorAll(".rcap").forEach(function(sel){ sel.onclick=function(e){e.stopPropagation();}; sel.onchange=function(e){ e.stopPropagation(); var r=findRoom(sel.dataset.rid); if(r){ r.cap=Number(sel.value); renderRooms(); } }; });
  c.querySelectorAll(".roomcard").forEach(function(card){
    card.onclick=function(e){
      var t=e.target;
      if(t.dataset && t.dataset.rm!=null){ removeFromRooms(Number(t.dataset.rm)); renderRooms(); return; }
      if(t.classList.contains("rdel")){ delRoom(t.dataset.rid); return; }
      if(t.classList.contains("rcap")) return;
      roomData.selected = card.dataset.rid; renderRooms();
    };
  });
}

async function saveRoomAssignments(){
  var assignments = roomData.companyPeople.map(function(p){
    var r = roomData.rooms.find(function(rm){ return rm.members.some(function(m){return m.row===p.row;}); });
    return { row:p.row, room: r ? r.id : '' };
  });
  roomMsg("儲存中…", true);
  try{
    await fetch(ENDPOINT, {method:"POST", mode:"no-cors", credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"saveRooms", pw:ADMIN_PW, assignments:assignments })});
    setTimeout(async function(){
      var res=await fetchData({showId:1, pw:ADMIN_PW});
      if(res&&res.ok){ roomData=buildRoomData(res.roster); renderRooms(); roomMsg("✓ 已儲存，並已寫回試算表", true); }
      else roomMsg("已送出，但確認失敗，請按重新整理檢查。");
    }, 1900);
  }catch(e){ roomMsg("儲存失敗，請檢查網路後再試。"); }
}

const addOverlay = document.getElementById("addOverlay");
const addErr = document.getElementById("addErr");
let ADD_REG = null;   // {regId, room, dept, contact, count, cap}
function bedNum(room){ var m=String(room||"").match(/(\d)/); return m?m[1]:"2"; }
function addTypeVal(){ const el=document.querySelector('input[name="addType"]:checked'); return el?el.value:"family"; }
function toggleAddType(){
  const emp = addTypeVal()==="employee";
  document.getElementById("addEmpWrap").style.display = emp?"block":"none";
  document.getElementById("addRelWrap").style.display = emp?"none":"block";
}
function addPriceNow(){
  const room = bedNum(ADD_REG && ADD_REG.room);
  const ageKey = document.getElementById("addAge").value;
  return (PRICES[room] && PRICES[room][ageKey]) || 0;
}
function fillAddPrice(){
  document.getElementById("addPricePreview").innerHTML =
    '費用試算：<b>NT$ '+fmt(addPriceNow())+'</b>　<span class="muted2">（'+esc(bedNum(ADD_REG&&ADD_REG.room))+'人房）加入後系統會自動重算補助與獨住加價</span>';
}
function addShowErr(m){ addErr.textContent=m; addErr.classList.add("show"); }
function startAddPerson(r){ if(ADMIN_MODE) openAddModal(r); }
function openAddModal(r){
  const grp = ((CURRENT&&CURRENT.roster)||[]).filter(function(x){ return x.regId===r.regId; });
  const cap = Number(bedNum(r.room));
  ADD_REG = { regId:r.regId, room:r.room, dept:r.dept, contact:r.contact, count:grp.length, cap:cap };
  document.getElementById("addWho").innerHTML =
    '加入到 <b>'+esc(r.contact||"")+'</b> 的報名單（<span class="reg">'+esc(r.regId||"")+'</span>）<br>'
    +'<span class="muted2">'+esc(r.room||"")+'　·　'+esc(r.dept||"未填部門")+'　·　目前 '+grp.length+' / '+cap+' 人　·　新成員與本單同房型、同部門</span>';
  document.getElementById("addRel").innerHTML = FAMILY_REL.map(function(x){ return '<option value="'+esc(x)+'">'+esc(x)+'</option>'; }).join("");
  document.getElementById("addAge").innerHTML = Object.keys(AGE_LABELS).map(function(k){ return '<option value="'+k+'">'+esc(AGE_LABELS[k])+'</option>'; }).join("");
  document.querySelector('input[name="addType"][value="family"]').checked = true;
  toggleAddType();
  document.getElementById("addName").value="";
  document.getElementById("addEmpId").value="";
  document.getElementById("addIdno").value="";
  document.getElementById("addDob").value="";
  fillAddPrice();
  addErr.classList.remove("show");
  const saveBtn = document.getElementById("addSave");
  if(cap && grp.length>=cap){
    addShowErr("這張報名單的"+esc(r.room)+"已住滿 "+grp.length+" 人，無法再加人。請改用「重新報名」整組重填，或先把房型改大。");
    saveBtn.disabled = true;
  } else { saveBtn.disabled = false; }
  addOverlay.classList.add("show");
  setTimeout(function(){ document.getElementById("addName").focus(); }, 50);
}
function closeAdd(){ addOverlay.classList.remove("show"); ADD_REG=null; }
Array.prototype.forEach.call(document.querySelectorAll('input[name="addType"]'), function(rb){ rb.addEventListener("change", toggleAddType); });
document.getElementById("addAge").addEventListener("change", fillAddPrice);
document.getElementById("addCancel").addEventListener("click", closeAdd);
document.getElementById("addSave").addEventListener("click", function(){
  if(!ADD_REG) return;
  if(ADD_REG.cap && ADD_REG.count>=ADD_REG.cap){ addShowErr("房間已滿，無法再加人。"); return; }
  const type = addTypeVal();
  const name = document.getElementById("addName").value.trim();
  const empId = document.getElementById("addEmpId").value.trim();
  const rel = document.getElementById("addRel").value;
  const ageKey = document.getElementById("addAge").value;
  const idno = document.getElementById("addIdno").value.trim();
  const dob = document.getElementById("addDob").value.trim();
  if(!name){ addShowErr("請填姓名。"); return; }
  if(type==="employee" && !empId){ addShowErr("員工請填工號（補助依工號計算）。"); return; }
  if(!idno){ addShowErr("請填身分證／居留證號（投保用）。"); return; }
  if(!dob){ addShowErr("請填出生年月日（投保用）。"); return; }
  const person = { type:type, name:name, relationship:type==="employee"?"":rel,
                   empId:type==="employee"?empId:"", ageLabel:AGE_LABELS[ageKey],
                   idNumber:idno, dob:dob, price:addPriceNow() };
  const btn=document.getElementById("addSave"); btn.disabled=true; btn.textContent="加入中…"; addErr.classList.remove("show");
  fetch(ENDPOINT, {method:"POST", mode:"no-cors", credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"addPerson", pw:ADMIN_PW, regId:ADD_REG.regId, person:person })})
    .finally(function(){
      setTimeout(function(){ btn.disabled=false; btn.textContent="加入並重算"; closeAdd(); load(ADMIN_MODE?ADMIN_PW:undefined); }, 1800);
    });
});

let DEPT_ROWS = [];   // [{group, name}]
document.getElementById("deptBtn").addEventListener("click", function(){
  if(ADMIN_MODE) enterDeptMode();
});
async function enterDeptMode(){
  document.getElementById("content").innerHTML = '<div class="loading">載入部門清單…</div>';
  let res;
  try{
    const r = await fetch(ENDPOINT + "?action=deptList&_=" + Date.now(), {credentials:"omit"});
    res = await r.json();
  }catch(e){ res = {ok:false, error:"連線失敗，請稍後再試。"}; }
  if(!(res && res.ok)){ document.getElementById("content").innerHTML = '<div class="loading">'+((res&&res.error)||"讀取失敗")+'</div>'; return; }
  DEPT_ROWS = (res.depts||[]).map(function(d){ return { group:d.group||'', name:d.name||'' }; });
  renderDeptEditor();
}
function readDeptDOM(){
  const rows = [];
  document.querySelectorAll("#deptBody .deptrow").forEach(function(tr){
    rows.push({ group: tr.querySelector(".d-grp").value.trim(),
                name:  tr.querySelector(".d-nm").value.trim() });
  });
  return rows;
}
function renderDeptEditor(){
  // 既有分組（含「獨立單位」）給 datalist 提示
  const groups = {};
  DEPT_ROWS.forEach(function(r){ if(r.group) groups[r.group] = 1; });
  ['獨立單位','業務處','研發處','製造處','品保處','管理處'].forEach(function(g){ groups[g] = 1; });
  const dlOpts = Object.keys(groups).map(function(g){ return '<option value="'+esc(g)+'">'; }).join('');
  const body = DEPT_ROWS.map(function(r, i){
    return '<tr class="deptrow">'
      +'<td><input class="d-grp" list="deptGroupList" value="'+esc(r.group)+'" placeholder="例：管理處／獨立單位" /></td>'
      +'<td><input class="d-nm" value="'+esc(r.name)+'" placeholder="例：法規文管部" /></td>'
      +'<td class="nowrap">'
        +'<button class="rdel d-up" data-i="'+i+'" title="上移">▲</button> '
        +'<button class="rdel d-dn" data-i="'+i+'" title="下移">▼</button> '
        +'<button class="rdel d-del" data-i="'+i+'">刪除</button>'
      +'</td></tr>';
  }).join("");
  document.getElementById("content").innerHTML =
      '<div class="roombar">'
    +   '<button class="btn ghost" id="exitDept">← 返回統計</button>'
    +   '<div class="rsum">部門共 <b>'+DEPT_ROWS.length+'</b> 個 ・ 順序＝報名表下拉選單顯示順序</div>'
    +   '<button class="btn gold" id="saveDept">💾 儲存部門清單</button>'
    + '</div>'
    + '<div class="roomhint">'
    + '說明：<br>'
    + '・「處／群組」是分組標題（例如：業務處、研發處、管理處）；報名表會用它做下拉選單分組。<br>'
    + '・不屬於某個「處」的單位（例如 <b>總經理室、稽核室、法規文管部</b>），請填「<b>獨立單位</b>」。<br>'
    + '・「部門名稱」就是員工會看到的選項（例：行銷設計部、品檢一課）。<br>'
    + '・儲存後，報名表與後台篩選都會即時改用新清單。已送出的舊資料不會被改動。'
    + '</div>'
    + '<datalist id="deptGroupList">'+dlOpts+'</datalist>'
    + '<div class="tablewrap"><table>'
    + '<thead><tr><th style="width:34%">處／群組</th><th>部門名稱</th><th style="width:170px">排序／刪除</th></tr></thead>'
    + '<tbody id="deptBody">'+(body || '<tr><td colspan="3" class="muted2" style="padding:14px">目前沒有部門。按下方「＋ 新增一列」加入。</td></tr>')+'</tbody></table></div>'
    + '<button class="btn ghost" id="addDept" style="margin-top:12px;">＋ 新增一列</button>'
    + '<div id="deptMsg" class="roommsg"></div>';
  document.getElementById("exitDept").onclick = function(){ load(ADMIN_MODE?ADMIN_PW:undefined); };
  document.getElementById("addDept").onclick = function(){
    DEPT_ROWS = readDeptDOM();
    DEPT_ROWS.push({ group:'', name:'' });
    renderDeptEditor();
  };
  document.getElementById("saveDept").onclick = saveDeptList;
  document.querySelectorAll("#deptBody .d-del").forEach(function(b){
    b.onclick = function(){ DEPT_ROWS = readDeptDOM(); DEPT_ROWS.splice(Number(b.dataset.i),1); renderDeptEditor(); };
  });
  document.querySelectorAll("#deptBody .d-up").forEach(function(b){
    b.onclick = function(){ DEPT_ROWS = readDeptDOM(); const i = Number(b.dataset.i);
      if(i>0){ const t=DEPT_ROWS[i-1]; DEPT_ROWS[i-1]=DEPT_ROWS[i]; DEPT_ROWS[i]=t; } renderDeptEditor(); };
  });
  document.querySelectorAll("#deptBody .d-dn").forEach(function(b){
    b.onclick = function(){ DEPT_ROWS = readDeptDOM(); const i = Number(b.dataset.i);
      if(i<DEPT_ROWS.length-1){ const t=DEPT_ROWS[i+1]; DEPT_ROWS[i+1]=DEPT_ROWS[i]; DEPT_ROWS[i]=t; } renderDeptEditor(); };
  });
}
function deptMsg(t, ok){ var el=document.getElementById("deptMsg"); if(el){ el.textContent=t; el.style.color=ok?"var(--forest-700)":"var(--rust)"; } }
async function saveDeptList(){
  const rows = readDeptDOM().filter(function(r){ return r.name; }).map(function(r){
    return { group: r.group || '獨立單位', name: r.name };
  });
  if(!rows.length){ deptMsg("至少要留 1 個部門。"); return; }
  // 防呆：同一筆 group+name 不能重複
  const seen = {};
  for(let i=0;i<rows.length;i++){
    const k = rows[i].group+'／'+rows[i].name;
    if(seen[k]){ deptMsg("部門重複：「"+k+"」，請刪掉重複的列。"); return; }
    seen[k] = 1;
  }
  deptMsg("儲存中…", true);
  try{
    await fetch(ENDPOINT, {method:"POST", mode:"no-cors", credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"saveDepts", pw:ADMIN_PW, depts:rows })});
    setTimeout(async function(){
      await loadDeptList();   // 重新載入記憶體裡的 DEPT_GROUPS
      deptMsg("✓ 已儲存部門清單（共 "+rows.length+" 個），報名表與後台篩選會用新清單。", true);
    }, 1500);
  }catch(e){ deptMsg("儲存失敗，請檢查網路後再試。"); }
}

async function saveSubsidyList(){

const SUBSIDY_CAP = 10000;
const SINGLE_SURCHARGE = 1600;

const erErr = document.getElementById("erErr");

function bedCap(room){ var m=String(room||"").match(/(\d)/); return m?Number(m[1]):0; }
function ageKeyFromLabel(label){
  if(!label) return "adult";
  if(label.indexOf("成人")===0) return "adult";
  if(label.indexOf("6-12")===0) return "student";
  if(label.indexOf("65")===0) return "senior";
  if(label.indexOf("身心")>=0) return "disabled";
  if(label.indexOf("2-5")>=0) return "child25";
  if(label.indexOf("未滿")>=0||label.indexOf("2 歲")>=0) return "baby";
  return "adult";
}
function priceOf(roomKey, ageKey){ return (PRICES[roomKey] && PRICES[roomKey][ageKey]) || 0; }

function startEditReg(regId){
  if(!ADMIN_MODE) return;
  const grp = ((CURRENT&&CURRENT.roster)||[]).filter(function(r){ return r.regId===regId; });
  if(!grp.length){ alert("找不到這張單。"); return; }
  const first = grp[0];
  ER = {
    regId: regId,
    contactName: first.contact||"",
    phone: first.phone||"",
    email: first.email||"",
    dept: first.dept||"",
    room: bedCap(first.room) || 2,         // 2 / 3 / 4
    occupancy: first.occupancy||"",
    people: grp.map(function(r){
      return {
        self: false,
        type: r.type==='員工' ? 'employee' : 'family',
        name: r.name||"",
        empId: r.empId||"",
        relationship: r.relationship||"",
        idNumber: (r.idNumber && !/\*/.test(r.idNumber)) ? r.idNumber : "",
        dob: r.dob||"",
        ageKey: ageKeyFromLabel(r.age),
      };
    })
  };
  // 把第一個人標為「本人」（不可移除、強制 employee）
  if(ER.people.length){ ER.people[0].self = true; ER.people[0].type = 'employee'; }
  renderEditReg();
  erErr.classList.remove("show");
  erOverlay.classList.add("show");
}

function setDobSelects(card, dobStr){
  const ySel=card.querySelector(".pDobY"), mSel=card.querySelector(".pDobM"), dSel=card.querySelector(".pDobD");
  // 年（2026→1930）
  let yh = '<option value="">年</option>';
  for(let y=2026; y>=1930; y--) yh += '<option value="'+y+'">'+y+'</option>';
  ySel.innerHTML = yh;
  let mh = '<option value="">月</option>';
  for(let m=1; m<=12; m++) mh += '<option value="'+String(m).padStart(2,"0")+'">'+m+' 月</option>';
  mSel.innerHTML = mh;
  // 解析既有 dob (YYYY-MM-DD 或 YYYY/MM/DD)
  const mm = String(dobStr||"").match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(mm){
    ySel.value = mm[1];
    mSel.value = String(mm[2]).padStart(2,"0");
  }
  refillDayOptions(ySel, mSel, dSel, mm ? String(mm[3]).padStart(2,"0") : "");
  ySel.onchange = function(){ refillDayOptions(ySel,mSel,dSel,dSel.value); recalcEditReg(); };
  mSel.onchange = function(){ refillDayOptions(ySel,mSel,dSel,dSel.value); recalcEditReg(); };
  dSel.onchange = recalcEditReg;
}
function refillDayOptions(ySel, mSel, dSel, want){
  const y = ySel.value, m = mSel.value;
  const dn = (y&&m) ? new Date(Number(y), Number(m), 0).getDate() : 31;
  let dh = '<option value="">日</option>';
  for(let d=1; d<=dn; d++) dh += '<option value="'+String(d).padStart(2,"0")+'">'+d+' 日</option>';
  dSel.innerHTML = dh;
  if(want && Number(want) <= dn) dSel.value = String(want).padStart(2,"0");
}

function wirePersonCard(i){
  const card = document.querySelector('#erPeople .er-person[data-i="'+i+'"]');
  if(!card) return;
  // type toggle
  if(i>0){
    Array.prototype.forEach.call(card.querySelectorAll('input[name="erType_'+i+'"]'), function(r){
      r.onchange = function(){
        ER.people[i].type = r.value;
        // 重畫 toggle 標籤
        Array.prototype.forEach.call(card.querySelectorAll('.er-ptoggle label'), function(lb){
          const inp = lb.querySelector("input"); lb.classList.toggle("on", inp.checked);
        });
        card.querySelector(".empOnly").style.display = (r.value==='employee') ? '' : 'none';
        card.querySelector(".famOnly").style.display = (r.value==='employee') ? 'none' : '';
        recalcEditReg();
      };
    });
  }
  // 移除
  const rmBtn = card.querySelector(".rm");
  if(rmBtn) rmBtn.onclick = function(){
    if(!confirm("確定要從這張單移除「"+(ER.people[i].name||"此成員")+"」？")) return;
    ER.people.splice(i,1); renderEditReg();
  };
  // 字段同步
  card.querySelector(".pName").oninput  = function(e){ ER.people[i].name = e.target.value; };
  const empInp = card.querySelector(".pEmpId");
  if(empInp) empInp.oninput = function(e){ ER.people[i].empId = e.target.value; };
  const relSel = card.querySelector(".pRel");
  if(relSel) relSel.onchange = function(e){ ER.people[i].relationship = e.target.value; };
  card.querySelector(".pIdno").oninput  = function(e){ ER.people[i].idNumber = e.target.value; };
  card.querySelector(".pAge").onchange  = function(e){ ER.people[i].ageKey = e.target.value; recalcEditReg(); };
  // DOB 選單
  setDobSelects(card, ER.people[i].dob);
}

function recalcEditReg(){
  if(!ER) return;
  const roomKey = String(ER.room||2);
  let total = 0, empCount = 0;
  ER.people.forEach(function(p,i){
    const price = priceOf(roomKey, p.ageKey);
    total += price;
    if(p.type==='employee') empCount++;
    const card = document.querySelector('#erPeople .er-person[data-i="'+i+'"]');
    if(card){ const pp = card.querySelector(".pPrice"); if(pp) pp.textContent = fmt(price); }
  });
  // 住宿安排
  const cap = ER.room, n = ER.people.length;
  let occ;
  if(n >= cap){ occ = '住滿'; ER.occupancy = '住滿'; }
  else if(cap===2 && n===1){ occ = '獨住加價'; ER.occupancy = '獨住加價'; }
  else { occ = '公司安排合住人'; ER.occupancy = '公司安排合住人'; }
  // 補助預估：min(員工數 * SUBSIDY_CAP, totalCost)
  const subsidyEst = Math.min(empCount * SUBSIDY_CAP, total);
  // 獨住加價
  const surcharge = (occ === '獨住加價') ? SINGLE_SURCHARGE : 0;
  const balance = Math.max(0, total - subsidyEst) + surcharge;
  document.getElementById("erTotal").textContent    = 'NT$ ' + fmt(total);
  document.getElementById("erSubsidy").textContent  = 'NT$ ' + fmt(subsidyEst);
  document.getElementById("erSur").textContent      = 'NT$ ' + fmt(surcharge);
  document.getElementById("erSurRow").style.display = surcharge>0 ? '' : 'none';
  document.getElementById("erBalance").textContent  = 'NT$ ' + fmt(balance);
  document.getElementById("erWho").innerHTML        = '報名單 <b class="reg">'+esc(ER.regId)+'</b>　·　目前 '+n+' 位　·　住宿：'+occ;
}

document.getElementById("erSave").addEventListener("click", function(){
  if(!ER) return;
  if(!ER.contactName.trim()){ erErr.textContent="請填聯絡窗口姓名。"; erErr.classList.add("show"); return; }
  if(!ER.people.length){ erErr.textContent="這張單沒有任何成員。"; erErr.classList.add("show"); return; }
  if(ER.people[0].type !== 'employee' || !ER.people[0].empId.trim()){
    erErr.textContent="第 1 位（本人）必須是員工且填工號。"; erErr.classList.add("show"); return;
  }
  for(let i=0; i<ER.people.length; i++){
    const p = ER.people[i];
    if(!p.name.trim()){ erErr.textContent="第 "+(i+1)+" 位未填姓名。"; erErr.classList.add("show"); return; }
    if(!p.idNumber.trim()){ erErr.textContent="第 "+(i+1)+" 位未填身分證／居留證號（投保用）。"; erErr.classList.add("show"); return; }
    if(!p.dob){
      // 從 DOM 取得最新 dob（dob 字串在卡片裡組）
      const card = document.querySelector('#erPeople .er-person[data-i="'+i+'"]');
      const y = card.querySelector(".pDobY").value, m = card.querySelector(".pDobM").value, d = card.querySelector(".pDobD").value;
      if(!(y&&m&&d)){ erErr.textContent="第 "+(i+1)+" 位未選擇完整出生年月日。"; erErr.classList.add("show"); return; }
      p.dob = y + '-' + m + '-' + d;
    }
    if(p.type==='employee' && !p.empId.trim()){
      erErr.textContent="第 "+(i+1)+" 位（員工）未填工號。"; erErr.classList.add("show"); return;
    }
  }
  // 重抓每張卡片的 DOB（避免使用者改完未失焦）
  ER.people.forEach(function(p,i){
    const card = document.querySelector('#erPeople .er-person[data-i="'+i+'"]');
    if(!card) return;
    const y = card.querySelector(".pDobY").value, m = card.querySelector(".pDobM").value, d = card.querySelector(".pDobD").value;
    if(y && m && d) p.dob = y + '-' + m + '-' + d;
  });

  const roomKey = String(ER.room||2);
  const roomLabel = roomKey + " 人房";
  const cap = ER.room, n = ER.people.length;
  const occ = (n >= cap) ? '住滿' : ((cap===2 && n===1) ? '獨住加價' : '公司安排合住人');
  const surcharge = (occ === '獨住加價') ? SINGLE_SURCHARGE : 0;

  const payloadPeople = ER.people.map(function(p){
    return {
      type: p.type,
      name: p.name.trim(),
      empId: p.type==='employee' ? p.empId.trim() : '',
      relationship: p.type==='employee' ? '' : (p.relationship||''),
      idNumber: p.idNumber.trim(),
      dob: p.dob,
      ageLabel: AGE_LABELS[p.ageKey] || '成人',
      price: priceOf(roomKey, p.ageKey)
    };
  });

  const btn = document.getElementById("erSave");
  btn.disabled = true; btn.textContent="儲存中…"; erErr.classList.remove("show");
  fetch(ENDPOINT, {method:"POST", mode:"no-cors", credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        action:"editReg", pw:ADMIN_PW, regId:ER.regId,
        contactName: ER.contactName, phone: ER.phone, email: ER.email, dept: ER.dept || '',
        roomLabel: roomLabel, occupancy: occ, surcharge: surcharge,
        people: payloadPeople
      })})
    .finally(function(){
      setTimeout(function(){ btn.disabled=false; btn.textContent="💾 儲存整張單"; closeEditReg(); load(ADMIN_PW); }, 1800);
    });
});

function exportExcel(){
  const s = (CURRENT && CURRENT.stats) || {};
  const balances = (CURRENT && CURRENT.regBalances) || {};
  const roster = (CURRENT && CURRENT.roster) || [];

  // 1) 名單分頁：一人一列，與後台名單同欄位＋自負額（每張單第一列才有金額，方便加總不重複）
  const seenReg = {};
  const rosterRows = roster.map(function(r){
    const isFirst = !(r.regId in seenReg);
    if(isFirst) seenReg[r.regId] = 1;
    return {
      "報名單編號": r.regId || "",
      "送出時間": r.time || "",
      "部門": r.dept || "",
      "聯絡窗口": r.contact || "",
      "聯絡電話": r.phone || "",
      "Email": r.email || "",
      "身分別": r.type || "",
      "姓名": r.name || "",
      "關係": r.relationship || "",
      "工號": r.empId || "",
      "年齡身分": r.age || "",
      "身分證／居留證": r.idNumber || "",
      "出生年月日": r.dob || "",
      "房型": r.room || "",
      "住宿安排": r.occupancy || "",
      "分配房號": r.assignedRoom || "",
      "個人費用": Number(r.price)||0,
      "個人補助": (r.subsidy===""||r.subsidy==null) ? "" : Number(r.subsidy),
      "獨住加價": Number(r.surcharge)||0,
      "自負額（每張單）": isFirst ? (Number(balances[r.regId])||0) : ""
    };
  });

  // 2) 統計分頁
  const statRows = [
    {"項目":"報名單數",     "數值": s.regCount||0,     "單位":"筆"},
    {"項目":"總人數",       "數值": s.totalPeople||0,  "單位":"人"},
    {"項目":"員工",         "數值": s.empCount||0,     "單位":"人"},
    {"項目":"眷屬",         "數值": s.famCount||0,     "單位":"人"},
    {"項目":"2 人房（房間）","數值": s.rooms2||0,       "單位":"間"},
    {"項目":"3 人房（房間）","數值": s.rooms3||0,       "單位":"間"},
    {"項目":"4 人房（房間）","數值": s.rooms4||0,       "單位":"間"},
    {"項目":"2 人房（人數）","數值": s.room2||0,        "單位":"人"},
    {"項目":"3 人房（人數）","數值": s.room3||0,        "單位":"人"},
    {"項目":"4 人房（人數）","數值": s.room4||0,        "單位":"人"},
    {"項目":"公司安排合住", "數值": s.companyCount||0,  "單位":"筆"},
    {"項目":"獨住加價",     "數值": s.singleCount||0,   "單位":"筆"},
    {"項目":"總費用",       "數值": s.totalCost||0,     "單位":"NT$"},
    {"項目":"公司補助合計", "數值": s.totalSubsidy||0,  "單位":"NT$"},
    {"項目":"獨住加價合計", "數值": s.totalSurcharge||0,"單位":"NT$"},
    {"項目":"應補差額合計", "數值": s.totalBalance||0,  "單位":"NT$"}
  ];

  // 3) 各單彙總分頁（一張報名單一列）
  const regAgg = {};
  roster.forEach(function(r){
    const k = r.regId || "";
    if(!regAgg[k]){
      regAgg[k] = { 報名單編號:k, 送出時間:r.time||"", 部門:r.dept||"", 聯絡窗口:r.contact||"",
                    聯絡電話:r.phone||"", Email:r.email||"", 房型:r.room||"", 住宿安排:r.occupancy||"",
                    人數:0, 員工數:0, 眷屬數:0, 總費用:0, 公司補助:0, 獨住加價:0,
                    自負額: Number(balances[k])||0 };
    }
    const a = regAgg[k];
    a.人數++;
    if(r.type==="員工") a.員工數++; else a.眷屬數++;
    a.總費用 += Number(r.price)||0;
    a.公司補助 += Number(r.subsidy)||0;
    a.獨住加價 += Number(r.surcharge)||0;
  });
  const regRows = Object.values(regAgg);

  // 建立 workbook
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(rosterRows);
  const ws2 = XLSX.utils.json_to_sheet(regRows);
  const ws3 = XLSX.utils.json_to_sheet(statRows);

  // 欄寬（依欄位內容粗估）
  ws1["!cols"] = [
    {wch:12},{wch:12},{wch:18},{wch:10},{wch:12},{wch:22},
    {wch:7},{wch:10},{wch:10},{wch:8},{wch:14},{wch:14},
    {wch:12},{wch:8},{wch:14},{wch:10},{wch:9},{wch:9},{wch:9},{wch:14}
  ];
  ws2["!cols"] = [{wch:12},{wch:12},{wch:18},{wch:10},{wch:12},{wch:22},{wch:8},{wch:14},
                  {wch:6},{wch:7},{wch:7},{wch:9},{wch:9},{wch:9},{wch:11}];
  ws3["!cols"] = [{wch:18},{wch:12},{wch:8}];

  XLSX.utils.book_append_sheet(wb, ws1, "名單");
  XLSX.utils.book_append_sheet(wb, ws2, "各單彙總");
  XLSX.utils.book_append_sheet(wb, ws3, "統計");

  const now = new Date();
  const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0")
              + "_" + String(now.getHours()).padStart(2,"0") + String(now.getMinutes()).padStart(2,"0");
  const fname = "2026員工旅遊報名_" + stamp + (SHOW_ID ? "_含身分證" : "_身分證遮蔽") + ".xlsx";
  XLSX.writeFile(wb, fname);
}

/* ===== 報名開關（手動截止／重新開放）===== */
document.getElementById("signupBtn").addEventListener("click", function(){
  if(!ADMIN_MODE) return;
  if(SIGNUP_OPEN===null){ load(ADMIN_PW); return; }   // 還沒載到狀態，先重新載
  const next = !SIGNUP_OPEN;
  const ok = confirm(next
    ? "確定要「重新開放報名」嗎？\n員工將可重新在報名表送出。"
    : "確定要「手動截止報名」嗎？\n報名表會擋下新的送出（已送出的資料不受影響）。");
  if(!ok) return;
  fetch(ENDPOINT, {method:"POST", mode:"no-cors", credentials:"omit",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ action:"toggleSignup", pw:ADMIN_PW, open:next })})
    .finally(function(){ setTimeout(function(){ load(ADMIN_PW); }, 1400); });
});

/* 進入即載入（免密碼，遮蔽版）。先抓部門清單再渲染，避免 chips 抓不到分組。 */
(async function(){
  await loadDeptList();
  load();
})();

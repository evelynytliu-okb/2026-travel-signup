<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>員工旅遊報名 後台 ｜ 訊映光電</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root{--forest-800:#1c4029;--forest-700:#265237;--forest-600:#357250;--moss:#6f9b5c;--cream:#f6f2e7;--paper:#fffdf8;--bark:#5b4636;--gold:#c79a3b;--rust:#b5532f;--line:#ddd5c2;--ink:#23291f;--muted:#7a7866;--shadow:0 12px 40px -18px rgba(19,48,31,.55);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(1200px 500px at 80% -10%,rgba(111,155,92,.18),transparent 60%),var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 64px;}
  h1{font-family:"Noto Serif TC",serif;font-size:clamp(22px,4vw,30px);color:var(--forest-800);margin:6px 0 2px;}
  .lead{color:var(--muted);font-size:14px;margin:0 0 20px;}

  /* gate */
  .gate{max-width:380px;margin:8vh auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:32px 26px;box-shadow:var(--shadow);text-align:center;}
  .gate h1{margin-bottom:6px;}
  .gate p{color:var(--muted);font-size:14px;margin:0 0 18px;}
  input{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;}
  input:focus{outline:none;border-color:var(--forest-600);box-shadow:0 0 0 4px rgba(53,114,80,.14);}
  .btn{background:var(--forest-700);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:15px;padding:12px 22px;border-radius:12px;cursor:pointer;transition:.15s;}
  .btn:hover{background:var(--forest-600);}
  .btn.gold{background:var(--gold);color:#23200f;}
  .btn.ghost{background:#eef4e8;color:var(--forest-700);}
  .gerr{display:none;color:#9a3414;background:#fbe6df;border:1px solid #e7a78f;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:12px;}
  .gerr.show{display:block;}

  /* stats */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:8px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 6px 24px -20px rgba(19,48,31,.5);}
  .stat .k{font-size:13px;color:var(--muted);}
  .stat .v{font-family:"Noto Serif TC";font-size:30px;font-weight:900;color:var(--forest-800);line-height:1.1;margin-top:4px;}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:3px;}
  .stat.money .v{color:var(--rust);font-size:24px;}
  .section-t{font-family:"Noto Serif TC";font-weight:700;color:var(--forest-800);font-size:18px;margin:24px 0 10px;}

  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px;}
  .pill{background:#eef4e8;color:var(--forest-700);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:700;}

  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:860px;}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #eee4d2;white-space:nowrap;}
  th{background:var(--forest-700);color:#fff;position:sticky;top:0;font-weight:700;}
  tr:nth-child(even) td{background:#fbf8f0;}
  td.emp{color:var(--forest-700);font-weight:700;}
  td.fam{color:var(--bark);}
  .reg{font-family:monospace;font-size:12px;color:var(--muted);}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .idnote{font-size:12.5px;color:var(--muted);}
  .loading{text-align:center;color:var(--muted);padding:30px;}
</style>
</head>
<body>

<!-- 密碼閘門 -->
<div id="gate" class="gate">
  <h1>報名後台</h1>
  <p>請輸入後台密碼以查看統計與名單。</p>
  <input id="pw" type="password" placeholder="後台密碼" autocomplete="off" />
  <div style="margin-top:14px;"><button class="btn gold" id="enterBtn" style="width:100%;">進入</button></div>
  <div class="gerr" id="gerr"></div>
</div>

<!-- 主畫面 -->
<div id="app" class="wrap" style="display:none;">
  <div class="topbar">
    <div>
      <h1>2026 員工旅遊 報名後台</h1>
      <p class="lead">資料即時來自 Google 試算表。身分證預設遮蔽。</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn ghost" id="refreshBtn">↻ 重新整理</button>
      <button class="btn" id="idBtn">顯示身分證</button>
    </div>
  </div>

  <div id="content"><div class="loading">載入中…</div></div>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzGE46TFzPMXlfBvT88mLjobexmgnpSlWf_U_Rl2PBzWMUca7_mUc5-pI64F75Kx8ymKg/exec";
let PW = "";
let SHOW_ID = false;
const fmt = n => Number(n||0).toLocaleString("en-US");

function jsonp(params){
  return new Promise((resolve)=>{
    const cb = "__dash" + Math.random().toString(36).slice(2,9);
    const s = document.createElement("script");
    window[cb] = function(res){ resolve(res); delete window[cb]; s.remove(); };
    s.onerror = function(){ resolve({ok:false,error:"連線失敗，請稍後再試。"}); delete window[cb]; s.remove(); };
    const q = Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k])).join("&");
    s.src = ENDPOINT + "?action=dashboard&callback=" + cb + "&" + q + "&_=" + Date.now();
    document.body.appendChild(s);
  });
}

async function load(){
  document.getElementById("content").innerHTML = '<div class="loading">載入中…</div>';
  const res = await jsonp({ pw:PW, showId: SHOW_ID ? 1 : 0 });
  if(!res || !res.ok){
    // back to gate if auth problem
    if(res && /密碼/.test(res.error||"")){
      document.getElementById("app").style.display="none";
      document.getElementById("gate").style.display="block";
      showGateErr(res.error);
      return;
    }
    document.getElementById("content").innerHTML = '<div class="loading">'+((res&&res.error)||"載入失敗")+'</div>';
    return;
  }
  render(res);
}

function render(res){
  const s = res.stats;
  const cards = [
    ['報名單數', s.regCount, '筆'],
    ['總人數', s.totalPeople, '人'],
    ['員工', s.empCount, '人'],
    ['眷屬', s.famCount, '人'],
    ['2人房', s.room2, '人'],
    ['3人房', s.room3, '人'],
    ['4人房', s.room4, '人'],
    ['公司安排合住', s.companyCount, '筆'],
    ['獨住加價', s.singleCount, '筆'],
  ].map(c=>`<div class="stat"><div class="k">${c[0]}</div><div class="v">${fmt(c[1])}<small>${c[2]}</small></div></div>`).join("");
  const money = [
    ['總費用', s.totalCost],
    ['公司補助合計', s.totalSubsidy],
    ['獨住加價合計', s.totalSurcharge],
    ['應補差額合計', s.totalBalance],
  ].map(c=>`<div class="stat money"><div class="k">${c[0]}</div><div class="v">NT$ ${fmt(c[1])}</div></div>`).join("");

  const rows = res.roster.map(r=>`
    <tr>
      <td class="reg">${r.regId}</td>
      <td>${r.contact||""}</td>
      <td class="${r.type==='員工'?'emp':'fam'}">${r.type}</td>
      <td>${r.name||""}</td>
      <td>${r.relationship||""}</td>
      <td>${r.empId||""}</td>
      <td>${r.age||""}</td>
      <td>${r.idNumber||""}</td>
      <td>${r.dob||""}</td>
      <td>${r.room||""}</td>
      <td>${r.occupancy||""}</td>
      <td style="text-align:right">${fmt(r.price)}</td>
      <td style="text-align:right">${r.subsidy!==""&&r.subsidy!=null?fmt(r.subsidy):"—"}</td>
    </tr>`).join("");

  document.getElementById("idBtn").textContent = res.showId ? "隱藏身分證" : "顯示身分證";
  SHOW_ID = !!res.showId;

  document.getElementById("content").innerHTML = `
    <div class="grid">${cards}</div>
    <div class="section-t">金額統計</div>
    <div class="grid">${money}</div>
    <div class="section-t">報名名單（每人一列）</div>
    <div class="idnote" style="margin-bottom:8px;">${res.showId ? "⚠️ 目前顯示完整身分證，請注意保密；看完可按「隱藏身分證」。" : "身分證已遮蔽，需要時按右上「顯示身分證」。"}</div>
    <div class="tablewrap"><table>
      <thead><tr>
        <th>報名單</th><th>聯絡窗口</th><th>身分別</th><th>姓名</th><th>關係</th><th>工號</th>
        <th>年齡身分</th><th>身分證字號</th><th>出生年月日</th><th>房型</th><th>住宿安排</th>
        <th style="text-align:right">費用</th><th style="text-align:right">補助</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="13" class="loading">目前沒有報名資料</td></tr>'}</tbody>
    </table></div>`;
}

function showGateErr(m){ const g=document.getElementById("gerr"); g.textContent=m; g.classList.add("show"); }
function enter(){
  const v = document.getElementById("pw").value.trim();
  if(!v){ showGateErr("請輸入密碼。"); return; }
  PW = v; SHOW_ID = false;
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  load();
}
document.getElementById("enterBtn").addEventListener("click", enter);
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") enter(); });
document.getElementById("refreshBtn").addEventListener("click", ()=>load());
document.getElementById("idBtn").addEventListener("click", ()=>{ SHOW_ID=!SHOW_ID; load(); });
</script>
</body>
</html>

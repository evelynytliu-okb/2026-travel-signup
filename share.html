<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 員工旅遊 掃碼報名 ｜ 訊映光電</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root{--forest-900:#001f3a;--forest-800:#003057;--forest-700:#0c3a63;--forest-600:#1a4a73;--moss:#3f7fb0;--cream:#eef3f8;--paper:#ffffff;--gold:#ff5c39;--rust:#e0492a;--line:#d6e0ea;--ink:#1c2b3a;--muted:#6b7a89;--shadow:0 16px 50px -20px rgba(0,31,58,.6);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px;
    background:radial-gradient(1000px 500px at 80% -10%,rgba(26,74,115,.22),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(0,48,87,.18),transparent 55%),var(--cream);}

  .card{width:100%;max-width:430px;background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;}
  .top{background:linear-gradient(160deg,var(--forest-800),var(--forest-600) 140%);color:#eaf1f8;padding:26px 26px 22px;text-align:center;position:relative;}
  .top::after{content:"";position:absolute;inset:0;opacity:.16;mix-blend-mode:soft-light;background:radial-gradient(closest-side,rgba(255,255,255,.7),transparent) 15% 130%/200px 200px no-repeat,radial-gradient(closest-side,rgba(255,255,255,.5),transparent) 90% -10%/220px 220px no-repeat;}
  .ribbon{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;letter-spacing:.12em;font-weight:700;background:rgba(255,253,248,.16);border:1px solid rgba(255,253,248,.3);padding:5px 13px;border-radius:999px;}
  .okb-logo{position:relative;height:42px;width:auto;display:block;margin:0 auto 14px;}
  .top h1{position:relative;font-family:"Noto Serif TC",serif;font-weight:900;font-size:27px;line-height:1.3;margin:14px 0 4px;}
  .top .sub{position:relative;font-size:15px;font-weight:500;opacity:.95;}
  .top .meta{position:relative;margin-top:14px;font-size:13.5px;opacity:.95;line-height:1.7;}
  .top .meta b{color:#fff;font-weight:700;}

  .body{padding:26px 26px 28px;text-align:center;}
  .cta{font-family:"Noto Serif TC";font-size:20px;font-weight:700;color:var(--forest-800);margin:0 0 4px;}
  .cta-sub{font-size:13.5px;color:var(--muted);margin:0 0 18px;}
  .qrbox{display:inline-block;padding:16px;background:#fff;border:2px solid var(--forest-700);border-radius:20px;box-shadow:0 10px 30px -18px rgba(0,31,58,.5);}
  #qr{width:280px;height:280px;display:grid;place-items:center;}
  #qr img,#qr canvas{display:block;width:280px !important;height:280px !important;}
  .qrhint{font-size:13px;color:var(--muted);margin:14px 0 16px;display:flex;align-items:center;justify-content:center;gap:6px;}

  .urlrow{display:flex;align-items:center;gap:8px;background:#eaf2fa;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .urlrow a{flex:1;font-size:13px;color:var(--forest-700);font-weight:700;text-decoration:none;word-break:break-all;text-align:left;}
  .copybtn{flex:none;border:none;background:var(--forest-700);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer;}
  .copybtn:hover{background:var(--forest-600);}
  .copied{background:var(--gold)!important;color:#23200f!important;}

  .notes{font-size:12.5px;color:var(--bark,#39495a);background:#fff1ec;border:1px solid #ffd9cb;border-radius:12px;padding:11px 14px;margin-top:14px;text-align:left;line-height:1.7;}
  .notes b{color:var(--rust);}

  .printbtn{margin-top:16px;border:1.5px dashed var(--moss);background:#eaf2fa;color:var(--forest-700);font-family:inherit;font-size:14px;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer;width:100%;}
  .printbtn:hover{background:var(--forest-600);color:#fff;border-style:solid;}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px;}

  /* 列印：A4 直式海報，置中、放大、比例正常，適合張貼產線公布欄 */
  @media print{
    @page{ size:A4 portrait; margin:14mm; }
    html,body{background:#fff !important;}
    body{display:block;padding:0;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .card{max-width:178mm;width:100%;margin:0 auto;border:1px solid var(--line);box-shadow:none;border-radius:16px;overflow:hidden;break-inside:avoid;}
    .top{padding:34px 32px 28px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .okb-logo{height:58px;margin-bottom:18px;}
    .ribbon{font-size:15px;padding:7px 16px;}
    .top h1{font-size:42px;margin:18px 0 6px;}
    .top .sub{font-size:20px;}
    .top .meta{font-size:17px;margin-top:18px;}
    .body{padding:34px 32px 30px;}
    .cta{font-size:30px;margin-bottom:6px;}
    .cta-sub{font-size:18px;margin-bottom:26px;}
    .qrbox{padding:20px;border-width:3px;margin-bottom:6px;}
    #qr{width:88mm;height:88mm;}
    #qr img,#qr canvas{width:88mm !important;height:88mm !important;}
    .qrhint{font-size:17px;margin:20px 0 22px;}
    .urlrow{justify-content:center;background:#eaf2fa !important;padding:14px 16px;}
    .urlrow a{flex:none;font-size:19px;text-align:center;}
    .printbtn,.copybtn,.foot,.notes{display:none !important;}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <svg class="okb-logo" viewBox="0 0 313.25 167.46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OKB 歐克">
        <path fill="#ff5c39" d="M220.1,146.15v-19.25c-27.09,7.9-65.23,12.95-92.82,12.95s-60.2-3.32-92.82-12.95v19.25c25.58,7.38,62.57,12.4,92.82,12.4s66.77-3.63,92.82-12.4Z"/>
        <path fill="#fff" d="M280.26,56.11c7.69.98,16.37,8.53,16.37,21.83,0,15.25-9.37,26.02-30.22,26.02h-46.31s0-93.74,0-93.74h46.17c16.93,0,27.7,10.35,27.7,26.02,0,11.89-8.11,18.33-13.71,19.31v.56ZM239.13,49.39h23.78c7.56,0,12.59-4.76,12.59-12.03,0-6.58-5.18-10.91-11.33-10.91h-25.04s0,22.95,0,22.95ZM264.31,87.73c8.53,0,12.87-4.62,12.87-11.61,0-7.14-5.04-11.61-12.17-11.61h-25.88s0,23.22,0,23.22h25.18Z"/>
        <path fill="#fff" d="M182.74,103.96l-34.82-43.16h-.26v43.16s-22.11,0-22.11,0V10.22s22.11,0,22.11,0v38.13h.4s33.5-38.13,33.5-38.13h25.66s-40.38,43.16-40.38,43.16l42.76,50.58h-26.85Z"/>
        <path fill="#fff" d="M60.05,6.81c-27.77,0-50.28,22.51-50.28,50.28,0,27.77,22.51,50.28,50.28,50.28,27.77,0,50.28-22.51,50.28-50.28,0-27.77-22.51-50.28-50.28-50.28ZM60.05,86.14c-16.05,0-29.05-13.01-29.05-29.05,0-16.05,13.01-29.05,29.05-29.05,16.05,0,29.05,13.01,29.05,29.05,0,16.05-13.01,29.05-29.05,29.05Z"/>
        <circle fill="#ff5c39" cx="253.08" cy="133.3" r="13.95"/>
      </svg>
      <span class="ribbon">🌲 2026 員工旅遊・歡渡員工親子逍遙遊</span>
      <h1>溪頭森林遊樂區<br/>車埕火車站 二日遊</h1>
      <div class="sub">訊映光電 ｜ 開放報名中</div>
      <div class="meta">
        📅 出發 <b>115/10/17（六）～10/18（日）</b><br/>
        🚆 含遊覽車・住宿・二日保險
      </div>
    </div>

    <div class="body">
      <p class="cta">📱 掃 QR Code 立即報名</p>
      <p class="cta-sub">用手機相機或 LINE 掃描下方條碼</p>

      <div class="qrbox"><div id="qr"></div></div>

      <p class="qrhint">👆 對準掃描，即可開啟報名表</p>

      <div class="urlrow">
        <a id="formLink" href="https://evelynytliu-okb.github.io/2026-travel-signup/" target="_blank" rel="noopener">evelynytliu-okb.github.io/2026-travel-signup/</a>
        <button class="copybtn" id="copyBtn">複製</button>
      </div>

      <div class="notes">
        <b>產線主管：</b>可直接出示此頁讓同仁掃描，或按下方「列印」印出張貼於公布欄。報名含眷屬、身分證／居留證號（投保用）與房型選擇。
      </div>

      <button class="printbtn" id="printBtn">🖨️ 列印此頁（張貼用）</button>
      <p class="foot">訊映光電股份有限公司 ｜ 2026 員工旅遊報名</p>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  var FORM_URL = "https://evelynytliu-okb.github.io/2026-travel-signup/";
  var box = document.getElementById("qr");

  function fallbackImg(){
    box.innerHTML = '<img alt="報名 QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=660x660&margin=0&data=' + encodeURIComponent(FORM_URL) + '">';
  }
  try{
    if(window.QRCode){
      // 產生高解析度 QR（660px），畫面用 CSS 縮為 280px、列印放大到 88mm 仍清晰
      new QRCode(box, {text:FORM_URL, width:660, height:660,
        colorDark:"#001f3a", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
    } else { fallbackImg(); }
  }catch(e){ fallbackImg(); }
  // 若函式庫沒成功渲染，1.2 秒後改用備援圖片
  setTimeout(function(){ if(!box.querySelector("img,canvas")) fallbackImg(); }, 1200);

  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  document.getElementById("copyBtn").addEventListener("click", function(){
    var b=this;
    navigator.clipboard.writeText(FORM_URL).then(function(){
      b.textContent="已複製"; b.classList.add("copied");
      setTimeout(function(){ b.textContent="複製"; b.classList.remove("copied"); }, 1800);
    }).catch(function(){});
  });
</script>
</body>
</html>
